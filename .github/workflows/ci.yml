name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail on conflict markers
        run: "! git grep -nE '^(<<<<<<<|>>>>>>>)( |$)'"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build site folder (tracked files minus repo tooling)
        run: |
          mkdir _site
          git archive HEAD | tar -x -C _site
          rm -rf _site/.github _site/.company _site/.work _site/tests _site/*.test.js _site/package.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
